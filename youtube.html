<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LathSMP | YouTube</title>

  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="css/lathsmp.css">
</head>

<body data-page="youtube">

<header>

  <div class="container header-content">

    <a href="index.html" class="logo">

      <img
        src="icon.png"
        alt="LathSMP">

      <span>LathSMP</span>

    </a>

    <nav>
      <!-- Navigation is loaded from site.json -->
    </nav>

  </div>

</header>


<main>

  <div class="container">


    <!-- INTRO -->

    <section class="welcome">

      <h1 id="youtubeTitle">
        YouTube
      </h1>

      <p id="youtubeDescription">
        Videos, Minecraft content and other things from Lath_g7y.
      </p>

    </section>


    <!-- CHANNEL -->

    <section>

      <h2>
        <span id="youtubeChannelName">
          Lath_g7y
        </span>
      </h2>

      <p>
        Check out the YouTube channel for videos,
        Minecraft content and more.
      </p>

      <a
        id="youtubeChannelLink"
        class="button"
        href="#"
        target="_blank"
        rel="noopener">

        <span id="youtubeChannelButton">
          Visit YouTube channel
        </span>

      </a>

    </section>


    <!-- CONTENT -->

    <section>

      <h2 id="youtubeContentTitle">
        Content
      </h2>

      <ul
        class="features"
        id="youtubeContent">

        <!-- Loaded from site.json -->

      </ul>

    </section>


    <!-- FUTURE -->

    <section>

      <h2 id="youtubeFutureTitle">
        More to come
      </h2>

      <p id="youtubeFutureText">
        More LathSMP and Minecraft content will be added over time.
      </p>

    </section>

  </div>

</main>


<footer>

  <div class="container footer-content">

    <span id="footerCopyright">
      LathSMP © 2026
    </span>

    <span id="footerDomain">
      lathsmp.me
    </span>

  </div>

</footer>


<script src="js/app.js"></script>

</body>

</html>
